name: Deploy browser demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "docs/demo/**"
      - "docs/assets/readme/pipeline.svg"
      - "docs/assets/readme/star-history.json"
      - "docs/assets/readme/video-before.jpg"
      - "docs/assets/readme/video-after.jpg"
      - "examples/media/**"
      - "logo.svg"
      - "scripts/build_pages_demo.py"
      - "scripts/build_star_history.py"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble demo site
        run: python3 scripts/build_pages_demo.py --output .pages-site

      - name: Build repository star history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/build_star_history.py
          --repository "${{ github.repository }}"
          --output .pages-site/assets/star-history.svg
          --history-output .pages-site/assets/star-history.json
          --history-url https://vectozavr.github.io/voicecut/assets/star-history.json
          --seed docs/assets/readme/star-history.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
