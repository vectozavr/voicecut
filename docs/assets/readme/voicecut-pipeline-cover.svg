<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="voicecut-cover-title voicecut-cover-description">
  <title id="voicecut-cover-title">VoiceCut editing pipeline</title>
  <desc id="voicecut-cover-description">Fragmented source takes pass through semantic word selection and aligned cut boundaries to become one clean audio and video edit.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8f9ff"/>
    </linearGradient>
    <linearGradient id="focus-panel" x1="548" y1="151" x2="1064" y2="747" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f4f5ff"/>
      <stop offset="1" stop-color="#eaedff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3049bc"/>
      <stop offset="0.52" stop-color="#5269d9"/>
      <stop offset="1" stop-color="#7667e8"/>
    </linearGradient>
    <linearGradient id="accent-soft" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#dce2ff"/>
      <stop offset="1" stop-color="#ece8ff"/>
    </linearGradient>
    <linearGradient id="final-wave" x1="1207" y1="0" x2="1481" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3049bc"/>
      <stop offset="0.55" stop-color="#5269d9"/>
      <stop offset="1" stop-color="#7b5fe5"/>
    </linearGradient>
    <filter id="card-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1a285f" flood-opacity="0.11"/>
    </filter>
    <filter id="focus-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#3049bc" flood-opacity="0.19"/>
    </filter>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <marker id="arrow" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3 3L17 10L3 17" fill="none" stroke="#415ccf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="source-wave-1"><rect x="126" y="389" width="258" height="56" rx="16"/></clipPath>
    <clipPath id="source-wave-2"><rect x="126" y="463" width="214" height="56" rx="16"/></clipPath>
    <clipPath id="source-wave-3"><rect x="170" y="537" width="214" height="56" rx="16"/></clipPath>
    <clipPath id="aligned-wave"><rect x="570" y="558" width="460" height="104" rx="26"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <g opacity="0.95">
    <path d="M440 450H500" fill="none" stroke="#415ccf" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1103 450H1163" fill="none" stroke="#415ccf" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="78" y="234" width="350" height="432" rx="40" fill="url(#panel)" stroke="#d6dbea" stroke-width="3"/>
  </g>
  <g filter="url(#focus-shadow)">
