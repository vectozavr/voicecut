      <rect x="311" y="408" width="5" height="20" rx="2.5"/><rect x="322" y="397" width="5" height="42" rx="2.5"/><rect x="333" y="405" width="5" height="26" rx="2.5"/><rect x="344" y="412" width="5" height="12" rx="2.5"/><rect x="355" y="400" width="5" height="36" rx="2.5"/>
