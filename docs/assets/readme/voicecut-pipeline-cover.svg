      <rect x="187" y="562" width="5" height="8" rx="2.5"/><rect x="198" y="554" width="5" height="24" rx="2.5"/><rect x="209" y="545" width="5" height="42" rx="2.5"/><rect x="220" y="559" width="5" height="14" rx="2.5"/><rect x="231" y="550" width="5" height="32" rx="2.5"/><rect x="242" y="541" width="5" height="50" rx="2.5"/><rect x="253" y="556" width="5" height="20" rx="2.5"/><rect x="264" y="562" width="5" height="8" rx="2.5"/><rect x="275" y="548" width="5" height="36" rx="2.5"/><rect x="286" y="556" width="5" height="20" rx="2.5"/><rect x="297" y="544" width="5" height="44" rx="2.5"/><rect x="308" y="558" width="5" height="16" rx="2.5"/><rect x="319" y="551" width="5" height="30" rx="2.5"/><rect x="330" y="560" width="5" height="12" rx="2.5"/><rect x="341" y="549" width="5" height="34" rx="2.5"/>
    </g>
  </g>

