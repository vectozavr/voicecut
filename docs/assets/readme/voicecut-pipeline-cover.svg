    <g fill="url(#final-wave)">
      <rect x="1230" y="438" width="7" height="14" rx="3.5"/><rect x="1244" y="427" width="7" height="36" rx="3.5"/><rect x="1258" y="414" width="7" height="62" rx="3.5"/><rect x="1272" y="432" width="7" height="26" rx="3.5"/><rect x="1286" y="405" width="7" height="80" rx="3.5"/><rect x="1300" y="424" width="7" height="42" rx="3.5"/><rect x="1314" y="434" width="7" height="22" rx="3.5"/><rect x="1328" y="417" width="7" height="56" rx="3.5"/><rect x="1342" y="429" width="7" height="32" rx="3.5"/><rect x="1356" y="409" width="7" height="72" rx="3.5"/><rect x="1370" y="435" width="7" height="20" rx="3.5"/><rect x="1384" y="421" width="7" height="48" rx="3.5"/><rect x="1398" y="411" width="7" height="68" rx="3.5"/><rect x="1412" y="431" width="7" height="28" rx="3.5"/><rect x="1426" y="402" width="7" height="86" rx="3.5"/><rect x="1440" y="423" width="7" height="44" rx="3.5"/><rect x="1454" y="434" width="7" height="22" rx="3.5"/>
