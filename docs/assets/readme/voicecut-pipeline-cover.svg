    <text x="114" y="357" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="750" letter-spacing="4" fill="#0d1526">SOURCE</text>

