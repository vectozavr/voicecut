    <text x="587" y="194" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="750" fill="#ffffff">2</text>
    <text x="558" y="255" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="750" letter-spacing="4" fill="#0d1526">SELECT WORDS</text>

    <g>
      <rect x="558" y="295" width="104" height="54" rx="17" fill="#eef0f6"/>
      <rect x="579" y="315" width="62" height="13" rx="6.5" fill="#a6afbf"/>
