    <rect x="1208" y="273" width="58" height="38" rx="19" fill="#e9edff"/>
    <text x="1237" y="301" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="750" fill="#415ccf">3</text>
    <text x="1208" y="357" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="750" letter-spacing="3.5" fill="#0d1526">CLEAN EDIT</text>

