    </g>
    <g clip-path="url(#aligned-wave)" fill="#64748b">
      <rect x="982" y="594" width="6" height="32" rx="3"/><rect x="995" y="582" width="6" height="56" rx="3"/><rect x="1008" y="602" width="6" height="16" rx="3"/><rect x="1021" y="590" width="6" height="40" rx="3"/>
    </g>
    <line x1="653" y1="535" x2="653" y2="686" stroke="#3049bc" stroke-width="7" stroke-linecap="round"/>
